<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f3a4d">
<title>批量报销资料整理</title>
<meta name="description" content="上传一批日本票据，识别、核对、整理公司归属后导出明细">
<style>
:root{--navy:#1f3a4d;--teal:#2f6f8f;--amber:#b86e1f;--amberbg:#fbf3ea;--green:#3e7d5a;--greenbg:#edf5f0;--ink:#1f2a33;--slate:#5b6b7a;--mist:#f2f5f7;--line:#dde3e8;--red:#a8432f;--redbg:#fbefec}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
html[lang=ja] body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans CJK JP",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.5}
a{color:var(--teal)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:8px;height:52px}
.brand{font-weight:700;color:var(--navy);font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;text-align:left;padding:0}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:#fff;color:var(--slate);padding:6px 12px;font-size:14px;min-height:34px}
.lang button[aria-pressed=true]{background:var(--navy);color:#fff}
.badge{display:inline-block;font-size:12.5px;font-weight:600;color:var(--amber);border:1px solid var(--amber);border-radius:999px;padding:2px 10px;background:#fff}
.badge.live{color:var(--teal);border-color:var(--teal)}
h1{white-space:pre-line;font-size:26px;line-height:1.3;margin:10px 0 6px;color:var(--navy)}
h2{font-size:20px;line-height:1.35;margin:8px 0 6px;color:var(--navy)}
h3{font-size:16px;margin:0 0 6px;color:var(--navy)}
p{margin:0 0 10px}
.sub{color:var(--slate);font-size:15px}
.small{font-size:13px;color:var(--slate)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;padding:12px 18px;min-height:48px;width:100%;text-align:center}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy);font-size:15px;min-height:44px;padding:9px 12px;font-weight:600}
.btn.ok{background:var(--green)}
.btn.warn{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.mini{width:auto;min-height:36px;padding:6px 12px;font-size:14px;border-radius:9px}
.link{background:none;border:0;color:var(--teal);text-decoration:underline;padding:0;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 180px}
section{padding:16px 0 22px}
.note{background:#fff;border:1px dashed var(--amber);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--amber);margin:10px 0}
.note.info{border-color:var(--teal);color:var(--teal)}
.ba{display:grid;grid-template-columns:1fr auto 1.25fr;gap:8px;align-items:center;margin:12px 0 14px}
.ba .side{background:var(--mist);border-radius:14px;padding:10px;min-height:150px}
.ba .side h3{margin:0 0 6px;font-size:13px;color:var(--slate);font-weight:600}
.pile{position:relative;height:110px}
.pile i{position:absolute;width:52px;height:68px;background:#fff;border:1px solid #cfd8df;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pile i::before{content:"";position:absolute;left:8px;right:8px;height:3px;background:#d9e0e6;top:14px;box-shadow:0 8px 0 #d9e0e6,0 16px 0 #d9e0e6}
.arrow{font-size:22px;color:var(--teal);font-weight:700}
.mini-l{list-style:none;margin:0;padding:0;font-size:12.5px}
.mini-l li{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed #cfd8df;padding:3px 0}
.mini-l li.w{color:var(--amber);font-weight:600}
.mini-l li.t{border:0;font-weight:700;color:var(--navy);padding-top:6px}
.points{display:grid;gap:8px;margin:14px 0 6px;padding:0;list-style:none}
.points li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.points b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.steps{display:flex;gap:4px;margin:8px 0 12px;padding:0;list-style:none}
.steps li{flex:1;text-align:center;font-size:12px;color:var(--slate);line-height:1.3}
.steps li::before{content:"";display:block;height:5px;border-radius:3px;background:var(--line);margin-bottom:5px}
.steps li.done::before{background:var(--teal)}
.steps li.cur{color:var(--navy);font-weight:700}
.steps li.cur::before{background:var(--amber)}
.flist{list-style:none;margin:10px 0;padding:0;display:grid;gap:8px}
.fitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}
.thumb{flex:none;width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--mist);border:1px solid var(--line);cursor:zoom-in}
.fmeta{flex:1;min-width:0}
.fname{font-weight:600;font-size:14.5px;word-break:break-all}
.st{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.st.pend{color:var(--amber);background:var(--amberbg)}
.st.conf{color:var(--green);background:var(--greenbg)}
.st.excl{color:#fff;background:var(--slate)}
.st.proc{color:var(--teal);background:#e8f1f5}
.st.fail{color:var(--red);background:var(--redbg)}
.st.wait{color:var(--slate);background:var(--mist)}
.st.co{color:var(--navy);background:var(--mist);font-weight:600}
.st.nco{color:var(--red);background:var(--redbg)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.sum div{background:var(--mist);border-radius:12px;padding:8px;text-align:center}
.sum small{display:block;color:var(--slate);font-size:12px}
.sum strong{font-size:20px;color:var(--navy)}
.cogrp{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:12px 0}
.cogrp h3{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.cogrp h3 small{font-weight:600;color:var(--teal);font-size:14px}
.panel{background:var(--mist);border-radius:14px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label.f{display:block;font-size:12.5px;color:var(--slate)}
label.f input,label.f select{display:block;width:100%;margin-top:2px;border:1px solid #c5d0d8;border-radius:8px;padding:8px;font-size:15px;background:#fff;color:var(--ink);min-height:40px}
label.f.req>span::after{content:" *";color:var(--red)}
label.f.chg input,label.f.chg select{border-color:var(--teal);background:#f3f9fc}
.orig{font-size:12px;color:var(--teal);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px}
.chip button{border:0;background:none;color:var(--slate);font-size:15px;padding:0 6px}
.rec{border:1px solid var(--line);border-radius:14px;background:#fff;margin:10px 0;overflow:hidden}
.rec.s-conf{border-color:var(--green)}
.rec.s-excl{opacity:.6}
.rh{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;width:100%;background:none;border:0;text-align:left;color:inherit}
.rh .main{flex:1;min-width:0}
.rh .m{font-weight:700;word-break:break-all}
.rh .meta{font-size:12.5px;color:var(--slate)}
.rh .amt{font-weight:700;white-space:nowrap;text-align:right}
.issues{list-style:none;margin:0;padding:0 12px 8px;font-size:13px}
.issues li{padding:2px 0}
.issues li.b{color:var(--red)}
.issues li.w{color:var(--amber)}
.issues li.i{color:var(--slate)}
.rb{padding:0 12px 12px;border-top:1px solid var(--line)}
.rb .src{display:flex;gap:10px;align-items:center;margin:10px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts .btn{flex:1 1 140px}
.sec-t{font-size:13px;font-weight:700;color:var(--navy);margin:12px 0 6px}
.taxl{display:grid;grid-template-columns:70px 1fr 110px 1fr 30px;gap:6px;align-items:end;margin-bottom:6px}
.taxl label.f input,.taxl label.f select{padding:6px;font-size:14px;min-height:36px}
.taxl .x{border:0;background:none;color:var(--red);font-size:18px;padding:0 0 8px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:left;vertical-align:top}
.tbl th{font-size:12.5px;color:var(--slate);font-weight:600;white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap}
.tbl td:nth-child(2){white-space:nowrap}
.tbl .s2{font-size:12px;color:var(--slate)}
.ov{position:fixed;inset:0;background:rgba(15,25,35,.86);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.ov img{max-width:100%;max-height:82vh;border-radius:8px;background:#fff}
.ov .cap{color:#fff;font-size:13px;margin:8px 0}
footer{border-top:1px solid var(--line);margin-top:24px;padding:14px 0 28px;font-size:12.5px;color:var(--slate)}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
@media (max-width:420px){h1{font-size:22px}.ba{gap:5px}.ba .side{padding:8px;min-height:0}.pile{height:92px;transform:scale(.82);transform-origin:left top}.mini-l{font-size:11.5px}.sum strong{font-size:17px}.tbl{font-size:13px}.taxl{grid-template-columns:62px 1fr 92px;}.taxl .tx{grid-column:2/3}.taxl .x{grid-column:3/4}}
</style>
</head>

<header class="top"><div class="wrap">
  <button class="brand" type="button" data-act="home" data-t="brand"></button>
  <div class="lang" role="group" aria-label="Language">

    <button type="button" data-lang="ja">日本語</button>
  </div>
</div></header>

<footer><div class="wrap" id="foot"></div></footer>
<input type="file" id="files" accept="image/jpeg,image/png,image/webp" multiple hidden>
<div class="toast hidden" id="toast" role="status"></div>
<div id="ovl"></div>

/* ================= 工具 ================= */
function q(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function fmt(n){return (typeof n==="number"&&isFinite(n))?n.toLocaleString("en-US",{maximumFractionDigits:2}):"—";}
function blank(v){return v===null||v===undefined||v===""||v==="null";}
function toNum(v){if(typeof v==="number"&&isFinite(v))return v;if(typeof v==="string"){var x=v.replace(/[,，\s¥￥円\-]/g,"");if(/^\d+(\.\d+)?$/.test(x))return +x;}return null;}
function r2(n){return Math.round(n*100)/100;}
function normDate(v){
 if(blank(v))return "";var s=String(v).trim().replace(/[年月\/.]/g,"-").replace(/日/g,"");
 var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(!m)return String(v).trim();
 return m[1]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[3]).slice(-2);
}
function validDate(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");if(!m)return false;var d=new Date(+m[1],+m[2]-1,+m[3]);return d.getFullYear()==+m[1]&&d.getMonth()==+m[2]-1&&d.getDate()==+m[3]&&+m[1]>=2000&&+m[1]<=2100;}
function normCur(v){if(blank(v))return "";var c=String(v).trim().toUpperCase();if(c==="YEN")c="JPY";if(c==="RMB")c="CNY";return /^[A-Z]{3}$/.test(c)?c:"";}
function normReg(v){return blank(v)?"":String(v).replace(/[\s\-‐ー－]/g,"").replace(/^ｔ|^t/,"T");}
function regState(v){v=normReg(v);if(!v)return "none";return /^T\d{13}$/.test(v)?"ok":"bad";}
function normRate(v){if(blank(v))return "";var m=String(v).match(/(\d+(\.\d+)?)/);return m?m[1]+"%":String(v);}
function normCo(s){return String(s||"").replace(/[\s　]/g,"").replace(/（[^）]*）|\([^)]*\)/g,"").replace(/株式会社|有限会社|合同会社|㈱|\(株\)|（株）|様|御中|殿/g,"");}

function own(o,k){return Object.prototype.hasOwnProperty.call(o,k);}

function same(a,b){return JSON.stringify(a==null?"":a)===JSON.stringify(b==null?"":b);}
function changed(r,k){return own(r.edit,k)&&!same(r.edit[k],r.ai[k]);}

  var b=String(t.amount_basis||"");return {rate:normRate(t.rate),amount:toNum(t.amount),basis:b==="tax_included"?"incl":(b==="tax_excluded"?"excl":"unk"),tax:toNum(t.tax)};
 }).filter(function(t){return t.rate||t.amount!==null||t.tax!==null;});
 var map={issuer:"issuer",merchant:"issuer",total:"total",date:"date",currency:"currency",addressee:"addressee",registration_no:"regNo",tax_lines:"taxLines","金額":"total","日付":"date"};
 var unclear=(Array.isArray(x.unclear)?x.unclear:[]).map(function(f){return map[String(f)]||"";}).filter(Boolean);
 return {docKind:KIND_MAP[String(x.doc_kind||"").trim()]||(blank(x.doc_kind)?"":"other"),date:normDate(x.date),issuer:blank(x.issuer)?(blank(x.merchant)?"":String(x.merchant)):String(x.issuer),
  total:toNum(x.total),currency:normCur(x.currency),addressee:blank(x.addressee)?"":String(x.addressee),tadashi:blank(x.tadashi)?"":String(x.tadashi),
  regNo:normReg(x.registration_no),otherNo:blank(x.other_no)?"":String(x.other_no),taxLines:lines,unclear:unclear};
}

function FN(k){return L().f[k]||k;}
function dupInfo(r){
 if(r.status==="excl")return null;
 var d=val(r,"date"),a=toNum(val(r,"total")),c=val(r,"currency");
 if(!validDate(d)||a===null||!c)return null;
 var ps=S.recs.filter(function(o){return o!==r&&o.status!=="excl"&&val(o,"date")===d&&toNum(val(o,"total"))===a&&val(o,"currency")===c;});
 if(!ps.length)return null;
 var t=L().is.dupWhy,why=[t.base],p=ps[0];
 if(val(p,"issuer")&&val(r,"issuer"))why.push(normCo(val(p,"issuer"))===normCo(val(r,"issuer"))?t.sameIssuer:t.diffIssuer);
 if(val(p,"regNo")&&val(r,"regNo"))why.push(val(p,"regNo")===val(r,"regNo")?t.sameReg:t.diffReg);
 return {ids:ps.map(function(o){return o.id;}),key:ps.map(function(o){return o.id;}).sort().join(","),why:why.join("，")};
}
function suggestCo(r){
 var a=val(r,"addressee");if(!a||r.extra.company)return null;
 var na=normCo(a);if(na.length<2)return null;
 for(var i=0;i<S.companies.length;i++){var nc=normCo(S.companies[i]);if(nc.length>=2&&(na===nc||na.indexOf(nc)>=0||nc.indexOf(na)>=0))return S.companies[i];}

function taxChecks(r){
 var t=L(),out=[],lines=val(r,"taxLines")||[],tot=toNum(val(r,"total"));
 lines.forEach(function(x){
  if(x.amount!==null&&x.tax!==null&&x.amount===x.tax)out.push({k:"taxEq"+x.rate,tx:t.is.taxEq(x.rate||"?")});
  var rate=parseFloat(x.rate)/100;
  if(x.amount!==null&&x.tax!==null&&rate>0&&x.amount!==x.tax){
   var exp=x.basis==="excl"?x.amount*rate:(x.basis==="incl"?x.amount*rate/(1+rate):null);
   if(exp!==null&&Math.abs(exp-x.tax)>Math.max(2,x.amount*0.002))out.push({k:"taxRate"+x.rate,tx:t.is.taxRate(x.rate)});
  }
 });
 if(tot!==null&&lines.length&&lines.every(function(x){return x.amount!==null&&x.basis!=="unk";})){
  var s=0;lines.forEach(function(x){s+=x.basis==="incl"?x.amount:x.amount+(x.tax||0);});
  if(Math.abs(s-tot)>1)out.push({k:"taxSum",tx:t.is.taxSum});
 }
 if(/様|御中|殿/.test(val(r,"issuer")||""))out.push({k:"issuerSama",tx:t.is.issuerSama});
 var ni=normCo(val(r,"issuer"));
 if(ni.length>=2&&S.companies.some(function(c){var nc=normCo(c);return nc.length>=2&&(ni===nc||ni.indexOf(nc)>=0||nc.indexOf(ni)>=0);}))out.push({k:"issuerOwn",tx:t.is.issuerOwn});
 if(regState(val(r,"regNo"))==="bad")out.push({k:"regBad",tx:t.is.regBad});
 var ad=val(r,"addressee")||"",td=val(r,"tadashi")||"";
 if(ad&&!/様|御中|殿/.test(ad))out.push({k:"addrNoSama",tx:t.is.addrNoSama});
 if(td&&!/但/.test(td))out.push({k:"tadashiOdd",tx:t.is.tadashiOdd});
 return out;
}
function issuesOf(r){
 var t=L(),out=[];
 var d=val(r,"date"),a=val(r,"total"),c=val(r,"currency");
 if(blank(d))out.push({lv:"b",tx:t.is.date});else if(!validDate(d))out.push({lv:"b",tx:t.is.dateBad});
 if(blank(val(r,"issuer")))out.push({lv:"b",tx:t.is.issuer});
 if(blank(a))out.push({lv:"b",tx:t.is.total});else if(toNum(a)===null||toNum(a)<=0)out.push({lv:"b",tx:t.is.totalBad});
 if(blank(c))out.push({lv:"b",tx:t.is.currency});else if(c!=="JPY")out.push({lv:"w",tx:t.is.otherCur(c)});
 (r.ai.unclear||[]).forEach(function(f){if(!changed(r,f)&&!r.ack["u:"+f])out.push({lv:"b",tx:t.is.unclear(FN(f)),ack:"u:"+f});});
 taxChecks(r).forEach(function(x){if(r.ack["c:"+x.k])out.push({lv:"i",tx:x.tx+" — "+t.is.ackDone});else out.push({lv:"b",tx:x.tx,ack:"c:"+x.k});});
 var di=dupInfo(r);
 if(di){if(r.dupAck===di.key)out.push({lv:"i",tx:t.is.dupOk(di.ids.join("、"))});else out.push({lv:"b",tx:t.is.dup(di.ids.join("、"),di.why),dup:di.key});}
 if(!r.extra.company){var sg=suggestCo(r);out.push({lv:"b",tx:t.is.company});if(sg)out.push({lv:"w",tx:t.is.sug(sg,val(r,"addressee")),sug:sg});}
 if(blank(r.extra.purpose))out.push({lv:"b",tx:t.is.purpose});
 var rs=regState(val(r,"regNo"));
 if(rs==="ok")out.push({lv:"i",tx:t.is.regOk,kohyo:true});else if(rs==="none")out.push({lv:"i",tx:t.is.regNone});
 if(!(val(r,"taxLines")||[]).length)out.push({lv:"i",tx:t.is.noTax});
 return out;
}

/* ================= 上传与读取 ================= */
function toJpeg(file){
 return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
   var m=1600,w=img.naturalWidth,hh=img.naturalHeight,k=Math.min(1,m/Math.max(w,hh));
   var c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(hh*k));
   var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
   URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.85));
  };
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("decode"));};
  img.src=url;
 });
}
function addFiles(list){
 var t=L(),skipped=[];
 for(var i=0;i<list.length;i++){
  var f=list[i];
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){skipped.push(f.name);continue;}
  if(S.files.length>=MAX_FILES){toast(t.tooMany);break;}
  S.fseq++;S.files.push({id:"F"+S.fseq,name:f.name,preview:"",status:"wait",err:"",n:0,_file:f});
 }
 if(skipped.length)toast(t.notImg+skipped.join("、"));
 render();pump();
}
var active=0;
function pump(){
 while(active<CONCURRENCY){
  var next=null;for(var i=0;i<S.files.length;i++)if(S.files[i].status==="wait"){next=S.files[i];break;}
  if(!next)return;
  active++;recognize(next).then(function(){active--;if(S.view==="up")render();pump();});
 }
}
function recognize(f){
 f.status="proc";if(S.view==="up")render();
 var batch=S;
 var p=f.dataUrl?Promise.resolve(f.dataUrl):toJpeg(f._file).then(function(d){f.dataUrl=d;f.preview=d;return d;});
 return p.then(function(dataUrl){
  var ctl=window.AbortController?new AbortController():null,timer=setTimeout(function(){if(ctl)ctl.abort();},45000);
  return fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:dataUrl}),signal:ctl?ctl.signal:undefined})
   .then(function(r){clearTimeout(timer);return r.json().catch(function(){return {error:"other"};}).then(function(j){return {ok:r.ok,j:j};});});
 }).then(function(x){
  if(batch!==S||!fileOf(f.id))return; /* 已清空或已移除 */
  if(x.ok&&x.j&&Array.isArray(x.j.receipts)){
   var rs=x.j.receipts.filter(function(r){return r&&typeof r==="object";});
   if(!rs.length){f.status="fail";f.err="empty";return;}
   S.recs=S.recs.filter(function(r){return r.fileId!==f.id;}); /* 重试时不重复 */
   rs.forEach(function(m,i){S.recs.push(makeRec(f.id,i+1,rs.length,aiFromModel(m),null,"live"));});
   f.status="done";f.n=rs.length;f.err="";
  }else{f.status="fail";f.err=(x.j&&x.j.error)||"other";}
 }).catch(function(e){if(batch===S&&fileOf(f.id)){f.status="fail";f.err=(e&&e.message==="decode")?"bad_image":"net";}});
}

/* ================= CSV ================= */
function cell(v){
 if(typeof v==="number")return String(r2(v));
 v=String(v==null?"":v);
 if(/^[=+\-@\t\r]/.test(v))v="'"+v; /* 防止表格公式注入 */
 return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}
function exportCsv(draft){
 var t=L(),rows=[];
 var list=draft?S.recs.slice():[];
 if(!draft){var G=groups();G.order.forEach(function(co){list=list.concat(G.g[co].recs);});}
 if(!list.length)return;
 if(draft)rows.push([t.draftMark]);
 rows.push(t.csvHead);
 list.forEach(function(r){
  var f=fileOf(r.fileId),lines=val(r,"taxLines")||[];
  var L10=lines.filter(function(x){return x.rate==="10%";})[0],L8=lines.filter(function(x){return x.rate==="8%";})[0];
  var others=lines.filter(function(x){return x!==L10&&x!==L8;}).map(function(x){return x.rate+" "+(x.amount==null?"":x.amount)+"("+t.tl[x.basis]+") / "+(x.tax==null?"":x.tax);}).join("; ");
  var lc=function(x,k){if(!x)return "";if(k==="basis")return t.tl[x.basis];return x[k]==null?"":x[k];};
  var ch=REC_FIELDS.filter(function(k){return changed(r,k);}).map(FN).join(" / ");
  var tot=toNum(val(r,"total"));
  rows.push([r.id,t.csvSrc[r.src],f?f.name:"",r.idx+"/"+r.count,t.kind[val(r,"docKind")||""],val(r,"date"),val(r,"issuer"),tot===null?"":tot,val(r,"currency"),val(r,"addressee"),val(r,"tadashi"),val(r,"regNo"),t.regStat[regState(val(r,"regNo"))],val(r,"otherNo"),
   lc(L10,"amount"),lc(L10,"basis"),lc(L10,"tax"),lc(L8,"amount"),lc(L8,"basis"),lc(L8,"tax"),others,
   r.extra.company,r.extra.claimant,r.extra.purpose,r.extra.category?t.cat[r.extra.category]:"",r.extra.note,t.csvStat[r.status],ch]);
 });
 if(!draft){var G2=groups();G2.order.forEach(function(co){Object.keys(G2.g[co].tot).sort().forEach(function(cur){var row=["",t.csvTot(co,cur),"","","","","",G2.g[co].tot[cur].sum,cur];rows.push(row);});});}
 var body="﻿"+rows.map(function(r){return r.map(cell).join(",");}).join("\r\n");
 S.lastCsv=body;
 try{
  var blob=new Blob([body],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=t.csvName(draft);document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},800);toast(t.csvToast);
 }catch(e){window.open("data:text/csv;charset=utf-8,"+encodeURIComponent(body));}
}

/* ================= 交互 ================= */
var toastTimer;
function toast(msg){var el=q("#toast");el.textContent=msg;el.classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.add("hidden");},3200);}
function go(v){S.view=v;render();window.scrollTo(0,0);}
function keepScroll(fn){var y=window.scrollY;fn();render();window.scrollTo(0,y);}
function showImg(fid,cap){
 var f=fileOf(fid);if(!f||!f.preview)return;
 q("#ovl").innerHTML='<div class="ov" data-act="closeimg"><img src="'+f.preview+'" alt=""><div class="cap">'+esc(f.name)+(cap?" · "+esc(cap):"")+'</div><button class="btn sec mini" type="button" data-act="closeimg">×</button></div>';
}
function hasData(){return S.mode==="live"&&S.files.length>0;}
function clearAll(){newBatch(null);S.view="home";render();window.scrollTo(0,0);toast(L().cleared);}
function touch(r){if(r.status==="conf"){r.status="pend";toast(L().reConfirm);}}
function applyDefaults(overwrite){
 var t=L(),n=0;
 if(!S.defCo&&!S.defClaim){toast(t.applyNone);return;}
 keepScroll(function(){S.recs.forEach(function(r){if(r.status!=="pend")return;var c=false;
  if(S.defCo&&(overwrite||!r.extra.company)){r.extra.company=S.defCo;c=true;}
  if(S.defClaim&&(overwrite||!r.extra.claimant)){r.extra.claimant=S.defClaim;c=true;}
  if(c)n++;});});
 toast(t.applied(n));
}
document.addEventListener("click",function(e){
 var el=e.target.closest("[data-img]");
 if(el&&!el.closest(".rh")){showImg(el.getAttribute("data-img"),el.getAttribute("data-cap"));return;}
 var b=e.target.closest("button,[data-act=closeimg]");if(!b||b.disabled)return;
 var lg=b.getAttribute("data-lang");if(lg){setLang(lg);return;}
 var act=b.getAttribute("data-act"),id=b.getAttribute("data-id"),r=id?recById(id):null,t=L();
 switch(act){
  case "home":go("home");break;
  case "upload":if(S.mode!=="live")newBatch("live");go("up");break;
  case "sample":if(hasData()&&!window.confirm(t.switchQ))return;loadSample();go("review");break;
  case "pick":q("#files").click();break;
  case "upview":go("up");break;
  case "review":go("review");break;
  case "result":go("result");break;
  case "back":go("review");break;
  case "retry":var f=fileOf(id);if(f&&f.status==="fail"){f.status="wait";render();pump();}break;
  case "retryAll":S.files.forEach(function(x){if(x.status==="fail")x.status="wait";});render();pump();break;
  case "rmfile":S.files=S.files.filter(function(x){return x.id!==id;});S.recs=S.recs.filter(function(x){return x.fileId!==id;});render();break;
  case "toggle":keepScroll(function(){S.open[id]=!S.open[id];});break;
  case "confirm":if(r&&r.status==="pend"&&!blocking(r).length)keepScroll(function(){r.status="conf";S.open[id]=false;});break;
  case "unconfirm":if(r)keepScroll(function(){r.status="pend";});break;
  case "exclude":if(r)keepScroll(function(){r.status="excl";});break;
  case "unexclude":if(r)keepScroll(function(){r.status="pend";S.open[id]=true;});break;
  case "notdup":if(r)keepScroll(function(){r.dupAck=b.getAttribute("data-key");});break;
  case "ack":if(r)keepScroll(function(){r.ack[b.getAttribute("data-k")]=true;});break;
  case "usesug":if(r)keepScroll(function(){r.extra.company=b.getAttribute("data-co");});break;
  case "restore":if(r)keepScroll(function(){delete r.edit[b.getAttribute("data-k")];touch(r);});break;
  case "tladd":if(r)keepScroll(function(){var l=JSON.parse(JSON.stringify(val(r,"taxLines")||[]));l.push({rate:"10%",amount:null,basis:"incl",tax:null});r.edit.taxLines=l;touch(r);});break;
  case "tldel":if(r)keepScroll(function(){var l=JSON.parse(JSON.stringify(val(r,"taxLines")||[]));l.splice(+b.getAttribute("data-i"),1);r.edit.taxLines=l;if(same(l,r.ai.taxLines))delete r.edit.taxLines;touch(r);});break;
  case "coadd":var v=(q("#coNew").value||"").trim();if(v&&S.companies.indexOf(v)<0)keepScroll(function(){S.companies.push(v);});break;
  case "codel":keepScroll(function(){var c=S.companies[+b.getAttribute("data-i")];S.companies.splice(+b.getAttribute("data-i"),1);if(S.defCo===c)S.defCo="";});break;
  case "applyEmpty":applyDefaults(false);break;
  case "applyAll":applyDefaults(true);break;
  case "sampleFill":
   if(S.mode!=="sample")return;
   keepScroll(function(){
    S.recs.forEach(function(x){
     if(x.status!=="pend")return;
     if(!x.extra.purpose){if(x.ai.total===880)x.extra.purpose=lang==="ja"?"社内打ち合わせ用の飲料":"内部会议用饮料";else if(x.ai.total===55000)x.extra.purpose=lang==="ja"?"取引先との定例会議":"与客户的例会";}
     if(!x.extra.company)x.extra.company=(x.ai.issuer.indexOf("港南")>=0||x.ai.total===600)?SAMPLE_CO[1]:SAMPLE_CO[0];
     if(!x.extra.claimant)x.extra.claimant=lang==="ja"?"山田（サンプル）":"山田（样例）";
     (x.ai.unclear||[]).forEach(function(k){x.ack["u:"+k]=true;});
     taxChecks(x).forEach(function(c){x.ack["c:"+c.k]=true;});
     var di=dupInfo(x);if(di)x.dupAck=di.key;
    });
    S.recs.forEach(function(x){if(x.status==="pend"&&!blocking(x).length)x.status="conf";});
   });
   toast(t.sampleFilled);break;
  case "csv":exportCsv(false);break;
  case "csvDraft":exportCsv(true);break;
  case "clear":if(window.confirm(t.clearQ))clearAll();break;
  case "closeimg":q("#ovl").innerHTML="";break;
 }
});
/* 输入：随打随存（不重绘）；离开输入框时重算并重绘 */
function setField(r,k,v){
 if(EXTRA_FIELDS.indexOf(k)>=0){r.extra[k]=v;}
 else{
  var nv=String(v);
  if(k==="total")nv=toNum(nv)!==null?toNum(nv):nv.trim();
  else if(k==="regNo")nv=normReg(nv);
  else if(k==="date")nv=nv.trim();
  if(same(nv,r.ai[k]))delete r.edit[k];else r.edit[k]=nv;
 }
 if(r.status==="conf"){r.status="pend";r._re=true;}
}
function setTax(r,i,k,v){
 var l=JSON.parse(JSON.stringify(val(r,"taxLines")||[]));if(!l[i])return;
 l[i][k]=(k==="amount"||k==="tax")?(String(v).trim()===""?null:toNum(v)):(k==="rate"?normRate(v):v);
 if(same(l,r.ai.taxLines))delete r.edit.taxLines;else r.edit.taxLines=l;
 if(r.status==="conf"){r.status="pend";r._re=true;}
}
function onEdit(el,commit){
 var def=el.getAttribute&&el.getAttribute("data-def");
 if(def){if(def==="co")S.defCo=el.value;else S.defClaim=el.value;return;}
 var id=el.getAttribute&&el.getAttribute("data-rid"),r=id&&recById(id);if(!r)return;
 if(el.hasAttribute("data-tl")){if(commit)setTax(r,+el.getAttribute("data-tl"),el.getAttribute("data-tk"),el.value);}
 else setField(r,el.getAttribute("data-k"),el.value);
 if(commit){if(r._re){r._re=false;toast(L().reConfirm);}keepScroll(function(){});}
}
document.addEventListener("input",function(e){if(e.target.hasAttribute&&e.target.hasAttribute("data-tl"))return;onEdit(e.target,false);});
document.addEventListener("change",function(e){
 var el=e.target;
 if(el.id==="files"){var fl=el.files;addFiles(fl?Array.prototype.slice.call(fl):[]);el.value="";return;}
 onEdit(el,true);
});
document.addEventListener("keydown",function(e){if(e.target&&e.target.id==="coNew"&&e.key==="Enter"){e.preventDefault();var b=q('[data-act=coadd]');if(b)b.click();}});
window.addEventListener("beforeunload",function(e){if(hasData()){e.preventDefault();e.returnValue=L().leaveQ;return L().leaveQ;}});
function setLang(lg){
 if(!T[lg])return;
 var y=window.scrollY;lang=lg;
 try{var u=new URL(location.href);u.searchParams.set("lang",lg);history.replaceState(null,"",u.toString());}catch(e){}
 render();window.scrollTo(0,y);
}
var param=null;try{param=new URL(location.href).searchParams.get("lang");}catch(e){}
if(param==="ja"||param==="zh")lang=param;
else{var nl=(navigator.languages&&navigator.languages[0])||navigator.language||"zh";lang=/^ja/i.test(nl)?"ja":"zh";}
/* 测试辅助：只读导出当前状态（不含图片数据） */
window.__demoState=function(){return JSON.parse(JSON.stringify({view:S.view,mode:S.mode,companies:S.companies,files:S.files.map(function(f){return {id:f.id,name:f.name,status:f.status,err:f.err,n:f.n};}),recs:S.recs,lastCsv:S.lastCsv||""}));};
render();
})();
